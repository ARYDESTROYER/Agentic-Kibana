name: CI

# Gate merges on the two checks that must always be green (CLAUDE.md §7):
#   1. the offline backend test suite (fake ES + mock LLM, no network/keys) —
#      this INCLUDES the deny-by-default auth route-coverage test, so a new
#      unauthenticated /api route fails CI.
#   2. the standalone web UI build (tsc --noEmit && vite build).
# Make `ci` a REQUIRED status check in branch protection (see CONTRIBUTING.md) so
# a PR cannot merge unless both pass.

on:
  pull_request:
  push:
    branches: [main, Testing]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (offline)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Run pytest (offline; includes auth route-coverage gate)
        run: python -m pytest -q

  webui:
    name: Web UI build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check + build (tsc --noEmit && vite build)
        run: npm run build

  # A single aggregate check to require in branch protection.
  ci:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [backend, webui]
    steps:
      - run: echo "All required checks passed."
