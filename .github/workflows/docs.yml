name: Documentation

on:
  pull_request:
    paths:
      - "docs/**"
      - "overrides/**"
      - "mkdocs.yml"
      - "VERSION"
      - "scripts/check_version.py"
      - "scripts/check_docs.py"
      - ".github/workflows/docs.yml"
  push:
    # Testing is the integration gate. Only main publishes Stable documentation.
    branches: [main, Testing]
    paths:
      - "docs/**"
      - "overrides/**"
      - "mkdocs.yml"
      - "VERSION"
      - "scripts/check_version.py"
      - "scripts/check_docs.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install documentation dependencies
        run: python -m pip install --requirement docs/requirements.txt

      - name: Check canonical product and documentation versions
        run: python scripts/check_version.py

      - name: Check documentation structure and links
        run: python scripts/check_docs.py

      - name: Build documentation
        env:
          TLSOC_DOCS_CHANNEL: ${{ github.ref == 'refs/heads/main' && 'Stable' || 'Testing' }}
          TLSOC_DOCS_EDIT_URI: ${{ github.ref == 'refs/heads/main' && 'edit/main/docs/' || 'edit/Testing/docs/' }}
        run: mkdocs build --strict

      - name: Upload documentation preview
        uses: actions/upload-artifact@v4
        with:
          name: tlsoc-docs-${{ github.sha }}
          path: site
          retention-days: 90

      - name: Resolve documentation version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: version
        shell: bash
        run: |
          product_version="$(tr -d '[:space:]' < VERSION)"
          docs_version="$(printf '%s' "$product_version" | cut -d. -f1-2)"
          echo "docs_version=$docs_version" >> "$GITHUB_OUTPUT"

      - name: Publish Stable versioned documentation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TLSOC_DOCS_CHANNEL: Stable
          TLSOC_DOCS_EDIT_URI: edit/main/docs/
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mike deploy --push --update-aliases \
            "${{ steps.version.outputs.docs_version }}" stable latest \
            --title "${{ steps.version.outputs.docs_version }} (Stable)"
          mike set-default --push stable
