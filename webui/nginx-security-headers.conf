# Browser response headers shared by every static Agentic SOC surface. Keep this
# separate from Cache-Control because nginx stops inheriting parent add_header
# directives as soon as a location defines one of its own.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
