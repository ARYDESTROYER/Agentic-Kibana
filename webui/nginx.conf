# Serve the SPA and proxy the API to the backend over the Compose network.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy the backend API. The SPA calls relative /api/* paths, so the
    # browser never needs to know the backend's address (no CORS, no Kibana proxy).
    location /api/ {
        proxy_pass http://tlsoc-backend:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # LLM investigations can run for a while — be generous with timeouts.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA client-side routing fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed assets; never cache index.html.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
