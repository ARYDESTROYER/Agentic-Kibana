# =============================================================================
# TLSOC Agentic Triage Suite — service block to ADD to TLSOCDockerDeploy.
#
# HOW TO USE (see DEPLOY.md): copy the `tlsoc-backend` (and optional
# `tlsoc-redis`) entries below INTO the `services:` map of
# TLSOCDockerDeploy/docker-compose.yml. Do NOT modify any existing service.
#
# WHAT IT ADDS / DOES NOT TOUCH:
#   * Adds ONE core service (tlsoc-backend) + one OPTIONAL cache (tlsoc-redis).
#   * Joins the existing default Compose network (no `networks:` key needed) and
#     reaches Elasticsearch by container name over TLS (https://elasticsearch:9200).
#   * Reuses the existing CA cert (./certs/ca/ca.crt) read-only — it does NOT
#     regenerate or alter certs.
#   * Touches NO existing service, the log pipeline, or the ECS schema. The
#     backend is a read-only consumer of the all-logs-* surface.
# =============================================================================

services:
  tlsoc-backend:
    # Option A (default): build from this repo. Clone agentic-kibana next to the
    # compose file so the backend is at ./agentic-kibana/backend.
    build:
      context: ./agentic-kibana/backend
      dockerfile: Dockerfile
    image: tlsoc-agentic-triage-backend:1.0.0
    # Option B: pre-build once (`docker build -t tlsoc-agentic-triage-backend:1.0.0 ./agentic-kibana/backend`)
    # then delete the `build:` block above and keep only the `image:` line.
    container_name: tlsoc-backend
    restart: unless-stopped
    depends_on:
      - elasticsearch
    environment:
      # --- Elasticsearch (TLS, container-name DNS) ---
      - ES_URL=https://elasticsearch:9200
      - ES_CA_CERT=/certs/ca.crt
      - ES_VERIFY_CERTS=true
      # --- Two scoped ES API keys (NEVER the elastic superuser) — see DEPLOY.md ---
      - ES_API_KEY=${TLSOC_ES_API_KEY}            # read-only, scoped to all-logs-*
      - ES_MGMT_API_KEY=${TLSOC_ES_MGMT_API_KEY}  # rw/create, scoped to tlsoc-agent-*
      # --- LLM provider keys (at least one of anthropic/openai) ---
      - ANTHROPIC_API_KEY=${TLSOC_ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${TLSOC_OPENAI_API_KEY:-}
      # --- Enrichment + embeddings (optional) ---
      - ABUSEIPDB_API_KEY=${TLSOC_ABUSEIPDB_API_KEY:-}
      - VIRUSTOTAL_API_KEY=${TLSOC_VIRUSTOTAL_API_KEY:-}
      - EMBEDDING_API_KEY=${TLSOC_EMBEDDING_API_KEY:-}
      # --- Cache (optional; in-memory fallback if Redis is absent) ---
      - REDIS_URL=${TLSOC_REDIS_URL:-redis://tlsoc-redis:6379/0}
      - LOG_LEVEL=${TLSOC_LOG_LEVEL:-INFO}
    volumes:
      # Reuse the existing CA (generated by TLSOCDockerDeploy's generate-certs.sh).
      - ./certs/ca/ca.crt:/certs/ca.crt:ro
    ports:
      # Optional: only needed for direct API access/debugging. The Kibana plugin
      # reaches the backend over the internal network (http://tlsoc-backend:8088),
      # so you can remove this mapping in production.
      - "8088:8088"

  # OPTIONAL but recommended: enrichment cache. The backend runs fine without it
  # (it falls back to an in-memory cache), but Redis preserves the cache across
  # restarts and protects tight free-tier enrichment API limits.
  tlsoc-redis:
    image: redis:7-alpine
    container_name: tlsoc-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
